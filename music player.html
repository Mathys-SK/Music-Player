<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LECTEUR PIXEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- jsmediatags doit être chargé avant votre script -->
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Press Start 2P', monospace;
      background: #000;
      color: #fff !important;        /* force blanc partout */
      image-rendering: pixelated;
      user-select: none;
    }
    button { font-family: inherit; cursor: pointer; color: #fff !important; }

    /* Écran de sélection */
    #start-screen {
      height: 100%;
      display: flex; justify-content: center; align-items: center; text-align: center;
    }
    #select-box {
      width: 300px; height: 300px;
      border: 4px solid #fff; background: #111;
      display: flex; justify-content: center; align-items: center;
      font-size: 12px; line-height: 1.5; cursor: pointer;
    }

    /* Écran principal */
    #main-screen {
      display: none; position: relative;
      max-width: 420px; margin: auto; padding: 20px;
    }
    #menu-btn {
      position: absolute; top: 20px; left: 20px;
      background: #111; border: 2px solid #fff;
      padding: 6px 10px; font-size: 10px; z-index: 20;
    }

    /* Cover, titre, artiste */
    #cover {
      width: 100%; border: 2px solid #fff;
      margin-top: 60px; display: none; object-fit: cover;
    }
    #title, #artist {
      text-align: center; padding: 0 6px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    #title {
      font-size: 14px; color: #fff !important; min-height: 18px; margin-top: 12px;
    }
    #artist {
      font-size: 8px; color: #ccc !important; min-height: 12px; margin-bottom: 18px;
    }

    /* Barre de progression */
    #progress-container {
      width: 100%; height: 10px;
      background: #333; border: 2px solid #fff;
      cursor: pointer; position: relative;
    }
    #progress {
      height: 100%; width: 0; background: #0f0;
    }
    .time-row {
      display: flex; justify-content: space-between;
      font-size: 8px; margin-top: 2px; padding: 0 4px; color: #fff;
    }

    /* Contrôles */
    #controls {
      display: flex; justify-content: center; gap: 20px; margin-top: 18px;
    }
    #controls button {
      background: #111; border: 2px solid #fff;
      padding: 10px 20px; font-size: 10px;
    }

    /* Menu latéral */
    #menu {
      position: fixed; top: 0; left: 0;
      width: 260px; height: 100%;
      background: #111; border-right: 2px solid #fff;
      padding: 20px; overflow-y: auto;
      transform: translateX(-100%); opacity: 0;
      visibility: hidden; pointer-events: none;
      transition: transform .3s ease, opacity .3s ease, visibility 0s .3s;
      z-index: 50;
    }
    #menu.open {
      transform: translateX(0); opacity: 1;
      visibility: visible; pointer-events: auto;
      transition: transform .3s ease, opacity .3s ease;
    }
    #menu h2 {
      font-size: 10px; margin-bottom: 10px;
      border-bottom: 2px solid #fff; padding-bottom: 5px;
    }
    #change-folder {
      background: #111; border: 2px solid #fff;
      padding: 8px; width: 100%; margin-bottom: 16px;
      font-size: 10px;
    }
    #music-list {
      list-style: none; padding: 0; margin: 0;
    }
    #music-list li {
      padding: 6px 4px; font-size: 8px;
      color: #ccc; border-bottom: 1px solid #333;
      cursor: pointer;
    }
    #music-list li:hover { background: #222; }
    #music-list li.active {
      color: #0f0; background: #1a1a1a;
    }
  </style>
</head>
<body>

  <!-- Sélection du dossier -->
  <div id="start-screen">
    <div id="select-box" onclick="selectFolder()">
      SÉLECTIONNER<br>UN DOSSIER<br>DE MUSIQUE
    </div>
  </div>

  <!-- Lecteur principal -->
  <div id="main-screen">
    <button id="menu-btn" onclick="toggleMenu()">MENU</button>

    <img id="cover" alt="Cover">
    <div id="title"></div>
    <div id="artist"></div>

    <div id="progress-container" onclick="seek(event)">
      <div id="progress"></div>
    </div>
    <div class="time-row">
      <span id="time-elapsed">0:00 / 0:00</span>
      <span id="time-remaining">-0:00</span>
    </div>

    <div id="controls">
      <button onclick="prevTrack()">PRÉC</button>
      <button id="play-btn" onclick="togglePlay()">PLAY</button>
      <button onclick="nextTrack()">SUIV</button>
    </div>
  </div>

  <!-- Menu latéral -->
  <div id="menu">
    <h2>MENU</h2>
    <button id="change-folder" onclick="selectFolder()">CHANGER DE DOSSIER</button>
    <ul id="music-list"></ul>
  </div>

  <audio id="audio"></audio>

  <script>
    // Références
    const audio        = document.getElementById('audio');
    const progress     = document.getElementById('progress');
    const titleEl      = document.getElementById('title');
    const artistEl     = document.getElementById('artist');
    const coverEl      = document.getElementById('cover');
    const musicListEl  = document.getElementById('music-list');
    const playBtn      = document.getElementById('play-btn');
    const timeElapsed  = document.getElementById('time-elapsed');
    const timeRemaining= document.getElementById('time-remaining');

    let tracks = [], currentIndex = 0, coverURL = null;

    function toggleMenu() {
      document.getElementById('menu').classList.toggle('open');
    }

    async function selectFolder() {
      try {
        const dirHandle = await window.showDirectoryPicker();
        tracks = [];
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.mp3')) {
            tracks.push({ name: entry.name, handle: entry });
          }
        }
        tracks.sort((a,b)=>a.name.localeCompare(b.name));
        renderPlaylist();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('main-screen').style.display  = 'block';
        if (tracks.length) loadTrack(0);
      } catch (e) {
        console.error('Dossier non chargé', e);
      }
    }

    function renderPlaylist() {
      musicListEl.innerHTML = '';
      tracks.forEach((t,i) => {
        const li = document.createElement('li');
        li.textContent = t.name.replace(/\.mp3$/i,'');
        li.onclick = () => loadTrack(i);
        if (i===currentIndex) li.classList.add('active');
        musicListEl.appendChild(li);
      });
    }

    function markActive(i) {
      Array.from(musicListEl.children)
        .forEach((li, idx)=> li.classList.toggle('active', idx===i));
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec)) return '0:00';
      const m = Math.floor(sec/60);
      const s = Math.floor(sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    async function loadTrack(index) {
      currentIndex = index;
      markActive(index);

      const file = await tracks[index].handle.getFile();
      audio.src = URL.createObjectURL(file);

      // Fallback texte
      titleEl.textContent  = file.name.replace(/\.mp3$/i,'');
      artistEl.textContent = 'ARTISTE INCONNU';
      hideCover();

      // Lire tags ID3
      jsmediatags.read(file, {
        onSuccess: tag => {
          const t = (tag.tags.title||'').trim();
          const a = (tag.tags.artist||'').trim();
          titleEl.textContent  = t || titleEl.textContent;
          artistEl.textContent = a || artistEl.textContent;

          if (tag.tags.picture && tag.tags.picture.data.length) {
            const { data, format } = tag.tags.picture;
            const blob = new Blob([new Uint8Array(data)], { type: format||'image/jpeg' });
            if (coverURL) URL.revokeObjectURL(coverURL);
            coverURL = URL.createObjectURL(blob);
            coverEl.src = coverURL;
            coverEl.style.display = 'block';
          } else {
            hideCover();
          }
        },
        onError: e => {
          console.warn('Pas de tags:', e);
          hideCover();
        }
      });

      audio.play().catch(()=>{});
      updatePlayButton();
    }

    function hideCover() {
      coverEl.removeAttribute('src');
      coverEl.style.display = 'none';
    }

    function togglePlay() {
      if (audio.paused) audio.play();
      else audio.pause();
      updatePlayButton();
    }
    function updatePlayButton() {
      playBtn.textContent = audio.paused ? 'PLAY' : 'PAUSE';
    }

    function prevTrack() {
      if (currentIndex>0) loadTrack(currentIndex-1);
    }
    function nextTrack() {
      if (currentIndex<tracks.length-1) loadTrack(currentIndex+1);
    }

    audio.addEventListener('timeupdate', ()=>{
      const d = audio.duration, c = audio.currentTime;
      if (Number.isFinite(d)) {
        progress.style.width = (c/d*100)+'%';
        timeElapsed.textContent   = `${formatTime(c)} / ${formatTime(d)}`;
        timeRemaining.textContent = `-${formatTime(d-c)}`;
      }
    });

    audio.addEventListener('ended', ()=>{
      if (currentIndex<tracks.length-1) nextTrack();
      else { audio.currentTime=0; updatePlayButton(); }
    });

    window.addEventListener('beforeunload', ()=>{
      if (coverURL) URL.revokeObjectURL(coverURL);
    });
  </script>
</body>
</html>
